# Object analysis for a whole plate, analysed while it is acquired.
#
# Every tile runs the three per-tile steps of object_analysis.yaml as soon as
# it lands. When the acquisition says a well is complete, summarise_well
# describes the population of that well; when it says the plate is
# complete, summarise_plate compares the wells.
#
# Submit each tile with its well and plate, and close them in order:
#
#   engine.submit("plate", tile, scope={"plate": "P1", "well": "B3"})
#   engine.submit("plate", last_tile_of_B3, scope={"plate": "P1", "well": "B3"},
#                 complete="well")
#   engine.submit("plate", last_tile_of_plate, scope={"plate": "P1", "well": "H12"},
#                 complete=["well", "plate"])
#
# Well names repeat on every plate, so a well is matched together with its
# plate: two plates can be acquired at once without their wells mixing.
#
# Tiles are kept in memory until their well is complete, so this recipe is
# for runs that close their wells. For tile-by-tile analysis with no well
# summary, use object_analysis.yaml.

metadata:
  purpose: "Object analysis per tile, population per well, summary per plate"
  version: "1.0"
  verbose: 1
  functions_dir: "../steps"

object_analysis:
  - detect_objects:
      channels: null
      channel_axis: null
      cellprob_threshold: 0.0
      flow_threshold: 0.4
      niter: null
      diameter: null
      segmentation_binning: 1
      border_margin_px: null
      min_area_px: null
      max_area_px: null
      min_equivalent_diameter_um: null
      max_equivalent_diameter_um: null
      gpu: true

  - extract_classical_features:
      extras: [all]           # the same feature families as object_analysis.yaml
      intensity_scale: null   # the camera's full range; see object_analysis.yaml

  - build_object_table:

  - summarise_well:
      scope: well
      enough_measured: 0.5    # a feature measured for fewer objects stays out
      enough_objects: 10      # fewer objects than this: summary, but no PCA
      components: 10
      seed: 0
      output_dir: null        # a folder to write <plate>_<well>_objects.csv

  - summarise_plate:
      scope: plate
      outlier_z: 3            # a well this many spreads from the plate median is flagged
      output_dir: null        # a folder to write <plate>_well_profiles.csv
