# Object detection checkpoint for one acquired image tile: masks and the
# detection checkpoint, no features.
#
# What to submit with each job (see README.md, "Input"):
#
#   image_path             an OME-Zarr position or an OME-TIFF
#   tile_id                e.g. ["R0", 3, 7]
#   tile_stage_xy_um       the tile's stage position
#   tile_z_um              capture height; optional
#   source_pixel_size_um   [x, y]
#   source_image_size_px   [nx, ny]
#   image_to_stage         the 2x2 matrix from image to stage axes
#   channels               up to three channel indices; null for all
#   gpu                    true or false
#
# What comes back, under `object_analysis`: the detection, with the paths
# of the masks and checkpoint it wrote.

metadata:
  purpose: "Object detection checkpoint"
  version: "1.0"
  verbose: 1
  functions_dir: "../steps"

object_detection:
  - detect_objects:       # Cellpose; for the watershed, see object_analysis_fast.yaml
      channels: null
      cellprob_threshold: 0.0
      flow_threshold: 0.4
      niter: null
      diameter: null
      segmentation_binning: 1
      border_margin_px: null
      min_area_px: null
      max_area_px: null
      min_equivalent_diameter_um: null
      max_equivalent_diameter_um: null
      # A small GPU can be slower than the processor: on a 4 GB NVIDIA T400,
      # Cellpose took 12 s per 512x512 tile on the GPU and 7.5 s on the CPU.
      # On such a card, time one tile each way and set false if it wins.
      gpu: true
      persist_only: true
