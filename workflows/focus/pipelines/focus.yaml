# Sharpness of every plane in an acquired z-stack, and the height it peaks at.
#
# What to submit with each job -- the input is not here because it changes with
# every stack, while this file is the recipe:
#
#   image_paths  the planes of one stack, in depth order, as the driver wrote
#                them (one 2-D file per plane), or
#   image_path   one position that declares its own z axis instead
#   z_um         the height each plane was taken at, from the acquisition's
#                own record. Without it the peak can only be a plane index.
#
# What comes back, under `score_focus`: `peak_z_um` and `found`, and `metrics`
# carrying both curves so the height can be argued with.

metadata:
  purpose: "Focus scoring for a z-stack"
  version: "1.0"
  verbose: 1
  functions_dir: "../steps"

# `metric` picks which sharpness measure decides the height. All four are
# scored on every run, so the curves can be compared afterwards:
#
#   brenner      gradient; sharp peak on structured tissue, fooled by noise
#   dct          frequency entropy; robust to brightness, broader peak
#   vollath_f4   autocorrelation; best in dim, noisy fluorescence
#   intensity    brightest `intensity_percentile` of pixels; confocal only,
#                where the pinhole makes brightness peak at focus
#
# `skip_ends` is how many planes at each end of the sweep may not win, because
# the ends of a drive carry edge artefacts that every sharpness metric rewards.

focus:
  - score_focus:
      metric: brenner            # brenner | dct | vollath_f4 | intensity
      intensity_percentile: 99   # only used by the intensity metric
      channel: 0
      level: 0
      t: 0
      skip_ends: 2
