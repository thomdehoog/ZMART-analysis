# Rare Event Selection Pipeline
#
# Segments cells, extracts features, selects rare events
# by percentile threshold, and writes feedback JSON.
#
# Input is a single 2D plane: from an OME-Zarr position (NGFF 0.4 or 0.5,
# one Zarr per position, axes TCZYX), an image file, or a skimage sample.
# The level / t / c / z keys below pick that plane and only apply to
# OME-Zarr input.

metadata:
  purpose: "Select rare cells by feature threshold"
  version: "1.0"
  verbose: 3
  functions_dir: "../steps"
  environment: "SMART--rare_event_selection--main"

rare-event-selection:
  - preprocess:
      level: 0          # multiscale resolution level, 0 is full resolution
      t: 0              # time point
      c: 0              # channel index, or a channel name like "DAPI"
      z: "mid"          # z index, "mid", or a projection: "max" / "mean"
      sigma: 1.0
      clip_limit: 0.03

  - segment:
      diameter: null
      gpu: false

  - extract_features:
      select_by: "area"
      percentile: 99

  - feedback:
      output_dir: "./output"
