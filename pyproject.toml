[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zmart-analysis"
version = "1.0.0rc1"
description = "Reproducible, environment-isolated image analysis pipelines for live adaptive microscopy"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "Thom de Hoog", email = "thom.dehoog@zmb.uzh.ch"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# What the orchestrator needs to run the shipped workflow tests in one
# environment. Each workflow's own conda environment is created by its
# workflows/<name>/environments/setup_env.py and carries the heavy tools
# (cellpose, torch, umap) that stay out of here.
test = [
    "pytest>=8.0",
    "pytest-timeout>=2.3",
    "numpy>=1.24",
    "scipy>=1.11",
    "scikit-image>=0.23",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "tifffile>=2024.0",
    "imagecodecs>=2024.0",
    "zarr>=3.0",
    "ngio>=1.0",
    "ome-types>=0.5",
    "pooch>=1.8",
]

[project.urls]
Repository = "https://github.com/thomdehoog/ZMART-analysis"
Documentation = "https://github.com/thomdehoog/ZMART-analysis/tree/main/docs"
Issues = "https://github.com/thomdehoog/ZMART-analysis/issues"

[tool.setuptools.packages.find]
include = ["engine*"]

[tool.ruff]
target-version = "py311"
line-length = 100
# The notebooks are run, not linted; the code blocks in the Markdown pages
# keep their hand-aligned comments.
extend-exclude = ["*.ipynb", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# Long lines are tolerated in tests and in the steps' parameter tables.
ignore = ["E501"]
per-file-ignores = {"tests/*" = ["B017", "B904", "B023"], "workflows/*/tests/*" = ["B017", "B904", "B023"]}

[tool.pytest.ini_options]
testpaths = ["tests", "workflows"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "integration: end-to-end tests using real YAML pipelines through the engine",
    "adversarial: stress / race-condition / corruption / protocol-attack tests",
    "slow: tests that take more than ~5s individually",
    "cellpose: requires the ZMART--object_analysis--cellpose conda environment",
    "pooch: uses public skimage sample data downloaded/cached by pooch",
    "conda_env: requires the conda environments a workflow's setup_env.py creates",
]
addopts = ["--tb=short", "--strict-markers"]
# A deadlock in the engine must fail the run, not hang it: shutdown waits
# for its threads, so without a limit a hung test runs until CI kills it.
timeout = 120
